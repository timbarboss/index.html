<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>VR Hand Physics - Precise Tracking</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { background: #000; overflow: hidden; font-family: Arial; color: #fff; touch-action: none; }
  
  /* Видео с камеры (фон) */
  #video {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    object-fit: cover; z-index: 0;
  }
  
  /* Канвас для рисования скелета и объектов */
  #canvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2;
  }
  
  /* Разделитель для VR (черная полоса посередине) */
  #divider {
    position: fixed; top: 0; left: 50%; width: 4px; height: 100vh;
    background: #000; z-index: 3; pointer-events: none;
  }
  
  /* Интерфейс подсказок */
  #ui {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 4; background: rgba(0,0,0,0.7); padding: 8px 16px;
    border-radius: 20px; font-size: 14px; pointer-events: none;
    text-align: center; max-width: 90%; border: 1px solid rgba(255,255,255,0.2);
  }

  /* Приложение ВК Видео (поверх всего) */
  #vkApp {
    position: fixed; inset: 0; z-index: 10; display: none; background: #000;
  }
  #vkFrame { width: 100%; height: 100%; border: none; }
  #vkClose {
    position: fixed; top: 20px; right: 20px; z-index: 11;
    background: #ff4444; color: #fff; border: 2px solid #fff;
    width: 50px; height: 50px; border-radius: 50%;
    font-size: 24px; cursor: pointer; display: none;
    box-shadow: 0 0 10px rgba(0,0,0,0.5);
  }

  /* Стартовый экран */
  #startScreen {
    position: fixed; inset: 0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    z-index: 20; display: flex; align-items: center; justify-content: center;
    flex-direction: column; padding: 20px; text-align: center;
  }
  #startScreen h1 {
    font-size: 32px; margin-bottom: 15px;
    background: linear-gradient(90deg, #00d2ff, #3a7bd5);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .instructions {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    padding: 20px; border-radius: 15px; margin-bottom: 25px;
    max-width: 400px; text-align: left; font-size: 15px; line-height: 1.6;
  }
  .instructions b { color: #00d2ff; }
  #startBtn {
    background: linear-gradient(90deg, #00d2ff, #3a7bd5); color: #fff;
    border: none; padding: 18px 40px; font-size: 18px; font-weight: bold;
    border-radius: 50px; cursor: pointer; box-shadow: 0 0 20px rgba(0,210,255,0.4);
  }
  #startBtn:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
  #errorMsg { color: #ff6b6b; margin-top: 15px; font-size: 14px; display: none; }
  
  /* Загрузка */
  #loading {
    position: fixed; inset: 0; background: #000; z-index: 15;
    display: none; align-items: center; justify-content: center;

  }
  .spinner {
    width: 50px; height: 50px; border: 4px solid #333;

    animation: spin 1s linear infinite; margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="startScreen">
  <h1>🥽 VR HAND PHYSICS</h1>
  <div class="instructions">
    📱 <b>Камера:</b> Задняя (смотри через шлем)<br><br>
    👆👆 <b>Двойной щипок:</b> Открыть меню<br>
    🤏 <b>Одинарный щипок:</b> Взять предмет<br>
    📺 <b>Иконка VK:</b> Смотреть видео<br>
    👇 <b>Руки вниз:</b> Калибровка пола
  </div>
  <button id="startBtn">ЗАПУСТИТЬ VR</button>
  <div id="errorMsg"></div>
</div>

<div id="loading">
  <div class="spinner"></div>
  <div style="color:#aaa">Загрузка нейросети...</div>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="divider"></div>
<div id="ui">Двойной щипок для меню</div>

<div id="vkApp">
  <!-- Используем мобильную версию VK для лучшей совместимости -->
  <iframe id="vkFrame" src="https://m.vk.com/video" allowfullscreen></iframe>
</div>
<button id="vkClose">✕</button>

<!-- Подключаем MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const ui = document.getElementById('ui');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const loading = document.getElementById('loading');
const errorMsg = document.getElementById('errorMsg');
const vkApp = document.getElementById('vkApp');
const vkFrame = document.getElementById('vkFrame');
const vkClose = document.getElementById('vkClose');

let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ==================== 3D МАТЕМАТИКА И КАМЕРА ====================
class Vec3 {
  constructor(x=0,y=0,z=0){this.x=x;this.y=y;this.z=z;}
  add(v){return new Vec3(this.x+v.x,this.y+v.y,this.z+v.z);}
  sub(v){return new Vec3(this.x-v.x,this.y-v.y,this.z-v.z);}
  mul(s){return new Vec3(this.x*s,this.y*s,this.z*s);}
  len(){return Math.hypot(this.x,this.y,this.z);}
  clone(){return new Vec3(this.x,this.y,this.z);}
  lerp(v,t){return new Vec3(this.x+(v.x-this.x)*t,this.y+(v.y-this.y)*t,this.z+(v.z-this.z)*t);}
}

// Параметры VR
const CAM_Y = 1.6;           // Высота глаз
const EYE_OFFSET = 0.032;    // Межзрачковое расстояние
const FOV_SCALE = 1.2;       // Масштаб поля зрения (чем больше, тем "шире" угол)

// Проекция 3D точки на 2D экран конкретного глаза
function project(p, eyeSign, halfW, offX) {
  const camX = eyeSign * EYE_OFFSET;
  const dx = p.x - camX;
  const dy = p.y - CAM_Y;
  const dz = p.z;
  
  // Если точка за спиной или слишком близко
  if (dz < 0.1) return { visible: false };
  
  const scale = 1 / (dz * FOV_SCALE);
  const sx = offX + halfW/2 + dx * scale * halfW;
  const sy = H/2 - dy * scale * H;
  
  return { x: sx, y: sy, scale, visible: true, depth: dz };
}

// ==================== КАМЕРА ТЕЛЕФОНА ====================
async function requestCamera() {
  startBtn.disabled = true;
  startBtn.textContent = '⏳ ПОДКЛЮЧЕНИЕ...';
  
  try {
    // Пытаемся включить ЗАДНЮЮ камеру
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: 'environment', // environment = задняя камера
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    return true;
  } catch (e) {
    errorMsg.style.display = 'block';
    errorMsg.textContent = 'Ошибка камеры: ' + e.message + '. Нужен HTTPS.';
    startBtn.disabled = false;
    return false;
  }
}

// ==================== MEDIAPIPE ТРЕКИНГ ====================
let handsTracker = null;
let smoothHands = []; // Сглаженные данные рук
let prevSmoothHands = []; 

// Преобразование сырых данных (0..1) в реальные 3D координаты (метры)
function landmarksToWorld(landmarks) {
  // 1. Вычисляем глубину руки по её размеру в кадре
  // Расстояние между запястьем (0) и средним пальцем (9) в пикселях экрана
  const wrist = landmarks[0];
  const middleBase = landmarks[9];
  const pixelSize = Math.hypot(wrist.x - middleBase.x, wrist.y - middleBase.y);
  
  // Реальный размер ладони ~0.18 метра. Чем меньше pixelSize, тем дальше рука.
  // Формула: Depth = RealSize / PixelSize * Constant
  let depth = 0.18 / (pixelSize + 0.001); 
  
  // Ограничиваем диапазон, чтобы рука не улетала в бесконечность
  depth = Math.min(Math.max(depth, 0.3), 2.0); 

  // 2. Преобразуем X и Y в метры относительно центра тела
  // aspectRatio нужен, чтобы круглые движения оставались круглыми
  const aspect = video.videoWidth / video.videoHeight;
  
  return landmarks.map(p => {
    // X: (p.x - 0.5) центрирует координаты. Умножаем на глубину, чтобы сохранить перспективу.
    // Инвертируем X, так как задняя камера часто дает зеркальное отражение для VR
    const x = -(p.x - 0.5) * depth * aspect * 1.5; 
    
    // Y: Высота. CAM_Y - это уровень глаз.
    const y = CAM_Y - (p.y - 0.5) * depth * 1.5;
    
    // Z: Глубина. Мы уже вычислили базовую глубину, корректируем по Z от MediaPipe
    const z = depth - p.z * 0.2; 
    
    return new Vec3(x, y, z);
  });
}

// Функция сглаживания (чтобы скелет не дрожал, но следовал точно)
function smoothHand(raw, prev) {
  if (!prev || prev.length !== raw.length) return raw.map(p => p.clone());
  // Lerp 0.5 означает 50% новой позиции, 50% старой. Быстро и плавно.
  return raw.map((p, i) => prev[i].lerp(p, 0.5));
}

async function initHandTracking() {
  handsTracker = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  
  handsTracker.setOptions({
    maxNumHands: 2,
    modelComplexity: 1, // 1 = лучше точность
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
  });

  handsTracker.onResults(onResults);

  const camera = new Camera(video, {
    onFrame: async () => { 
      if (handsTracker) await handsTracker.send({ image: video }); 
    },
    width: 640, height: 480
  });
  camera.start();
}

function onResults(results) {
  let rawHands = [];
  if (results.multiHandLandmarks) {
    for (const lm of results.multiHandLandmarks) {
      rawHands.push(landmarksToWorld(lm));
    }
  }
  
  // Применяем сглаживание
  smoothHands = rawHands.map((raw, i) => smoothHand(raw, prevSmoothHands[i]));
  prevSmoothHands = smoothHands.map(h => h.map(p => p.clone()));
}

// ==================== ЖЕСТЫ И ЛОГИКА ====================
function dist3(a, b) { return a.sub(b).len(); }

// Проверка щипка (расстояние между большим и указательным)
function isPinch(hand) {
  const d = dist3(hand[4], hand[8]);
  const size = dist3(hand[0], hand[9]); // Размер ладони для масштаба
  return d < size * 0.4; // Порог срабатывания
}

// Детектор двойного тапа
let lastTapTime = [0, 0];
function checkDoubleTap(handIndex, now) {
  const timeSinceLast = now - lastTapTime[handIndex];
  if (timeSinceLast < 400 && timeSinceLast > 50) {
    lastTapTime[handIndex] = 0; // Сброс
    return true;
  }
  lastTapTime[handIndex] = now;
  return false;
}

// ==================== МИР И ФИЗИКА ====================
let floorY = 0.0;
let objects = [];
let menuVisible = false;
let menuItems = [];

class PhysObject {
  constructor(pos, shape, color, size=0.08) {
    this.pos = pos.clone();
    this.vel = new Vec3(0,0,0);
    this.shape = shape;
    this.color = color;
    this.size = size;
    this.held = false;
    this.heldByHand = -1;
    this.holdOffset = new Vec3();
    this.history = []; // Для броска
    this.rotation = Math.random() * 6;
  }
  
  update(dt, now) {
    if (this.held) {
      const hand = smoothHands[this.heldByHand];
      if (hand && isPinch(hand)) {
        // Жесткая привязка к руке
        const target = hand[8].add(this.holdOffset);
        this.pos = target;
        
        // Записываем историю для расчета скорости броска
        this.history.push({ pos: target.clone(), time: now });
        if (this.history.length > 4) this.history.shift();
      } else {
        this.release();
      }
    } else {
      // Гравитация
      this.vel.y -= 15 * dt;
      this.pos = this.pos.add(this.vel.mul(dt));
      
      // Пол
      if (this.pos.y < floorY + this.size) {
        this.pos.y = floorY + this.size;
        this.vel.y *= -0.5; // Отскок
        this.vel.x *= 0.9;  // Трение
        this.vel.z *= 0.9;
      }
      
      // Стены (невидимые)
      if (Math.abs(this.pos.x) > 2.5) { this.pos.x = Math.sign(this.pos.x)*2.5; this.vel.x *= -0.5; }
      if (this.pos.z < 0.2) { this.pos.z = 0.2; this.vel.z *= -0.5; }
      if (this.pos.z > 4) { this.pos.z = 4; this.vel.z *= -0.5; }
    }
    this.rotation += this.vel.x * dt;
  }
  
  release() {
    // Расчет скорости броска
    if (this.history.length >= 2) {
      const last = this.history[this.history.length-1];
      const first = this.history[0];
      const dt = (last.time - first.time) / 1000;
      if (dt > 0) {
        this.vel = last.pos.sub(first.pos).mul(1/dt);
      }
    }
    this.held = false;
    this.heldByHand = -1;
    this.history = [];
  }
}

// Создание меню
function buildMenu(centerPos) {
  menuItems = [];
  const items = [
    { shape: 'cube', color: '#ff4757', label: 'КУБ' },
    { shape: 'sphere', color: '#2ed573', label: 'ШАР' },
    { shape: 'cylinder', color: '#ffa502', label: 'ЦИЛИНДР' },
    { shape: 'pyramid', color: '#a4b0be', label: 'ПИРАМИДА' },
    { shape: 'vk', color: '#0077FF', label: 'VK VIDEO' } // Иконка ВК
  ];
  
  items.forEach((item, i) => {
    // Расставляем предметы полукругом перед игроком
    const angle = -Math.PI/2 + (i / (items.length-1)) * Math.PI; // от -90 до +90 градусов
    const radius = 0.4;
    const pos = new Vec3(
      centerPos.x + Math.cos(angle) * radius,
      centerPos.y + Math.sin(angle) * radius * 0.5,
      centerPos.z - 0.2
    );
    menuItems.push({ ...item, pos, id: i });
  });
}

// ==================== ОТРИСОВКА ====================
function drawObject(obj, eyeSign, halfW, offX) {
  const p = project(obj.pos, eyeSign, halfW, offX);
  if (!p.visible) return;
  const size = obj.size * p.scale * halfW * 1.5;
  if (size < 1) return;

  // Тень
  const sProj = project(new Vec3(obj.pos.x, floorY, obj.pos.z), eyeSign, halfW, offX);
  if (sProj.visible) {
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(sProj.x, sProj.y, size*0.8, size*0.3, 0, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(obj.rotation);
  ctx.fillStyle = obj.color;
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;

  if (obj.shape === 'cube') {
    ctx.fillRect(-size, -size, size*2, size*2);
    ctx.strokeRect(-size, -size, size*2, size*2);
    // 3D эффект
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.moveTo(size, -size); ctx.lineTo(size*1.2, -size*1.2);
    ctx.lineTo(size*1.2, size*0.8); ctx.lineTo(size, size);
    ctx.fill();
  } else if (obj.shape === 'sphere') {
    const g = ctx.createRadialGradient(-size*0.3, -size*0.3, 0, 0, 0, size);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, obj.color); g.addColorStop(1, '#000');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.fill();
  } else if (obj.shape === 'cylinder') {
    ctx.fillRect(-size*0.6, -size, size*1.2, size*2);
    ctx.strokeRect(-size*0.6, -size, size*1.2, size*2);
    ctx.beginPath(); ctx.ellipse(0, -size, size*0.6, size*0.2, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  } else if (obj.shape === 'pyramid') {
    ctx.beginPath(); ctx.moveTo(0, -size); ctx.lineTo(-size, size); ctx.lineTo(size, size); ctx.fill(); ctx.stroke();
  } else if (obj.shape === 'vk') {
    // Логотип VK (упрощенный)
    ctx.beginPath(); ctx.arc(0, 0, size, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('VK', 0, 0);
  }

  if (obj.held) {
    ctx.strokeStyle = '#0ff'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(0, 0, size*1.3, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawHands(eyeSign, halfW, offX) {
  const connections = [
    [0,1],[1,2],[2,3],[3,4], [0,5],[5,6],[6,7],[7,8],
    [5,9],[9,10],[10,11],[11,12], [9,13],[13,14],[14,15],[15,16],
    [13,17],[17,18],[18,19],[19,20],[0,17]
  ];
  
  smoothHands.forEach((hand, hi) => {
    const color = hi === 0 ? '#00d2ff' : '#ff00ea'; // Левая - голубая, Правая - розовая
    
    // Рисуем кости
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    
    for (const [a, b] of connections) {
      const pa = project(hand[a], eyeSign, halfW, offX);
      const pb = project(hand[b], eyeSign, halfW, offX);
      if (pa.visible && pb.visible) {
        ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
      }
    }
    
    // Рисуем суставы
    for (let i = 0; i < hand.length; i++) {
      const pp = project(hand[i], eyeSign, halfW, offX);
      if (pp.visible) {
        ctx.fillStyle = [4,8,12,16,20].includes(i) ? '#fff' : color;
        ctx.beginPath(); ctx.arc(pp.x, pp.y, [4,8,12,16,20].includes(i) ? 6 : 3, 0, Math.PI*2); ctx.fill();
      }
    }
    
    // Курсор щипка
    const tip = project(hand[8], eyeSign, halfW, offX);
    if (tip.visible) {
      const pinched = isPinch(hand);
      ctx.strokeStyle = pinched ? '#ffff00' : 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 12, 0, Math.PI*2); ctx.stroke();
    }
  });
}

function drawFloor(eyeSign, halfW, offX) {
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
  ctx.lineWidth = 1;
  // Сетка
  for(let x=-2; x<=2; x+=0.5) {
    const p1 = project(new Vec3(x, floorY, 0.5), eyeSign, halfW, offX);
    const p2 = project(new Vec3(x, floorY, 3.0), eyeSign, halfW, offX);
    if(p1.visible && p2.visible) { ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  }
  for(let z=0.5; z<=3; z+=0.5) {
    const p1 = project(new Vec3(-2, floorY, z), eyeSign, halfW, offX);
    const p2 = project(new Vec3(2, floorY, z), eyeSign, halfW, offX);
    if(p1.visible && p2.visible) { ctx.beginPath(); ctx.moveTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.stroke(); }
  }
}

// ==================== ГЛАВНЫЙ ЦИКЛ ====================
let lastTime = performance.now();
let prevPinchState = [false, false];

function loop() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  
  ctx.clearRect(0, 0, W, H);
  
  // 1. Логика жестов
  smoothHands.forEach((hand, i) => {
    const pinched = isPinch(hand);
    
    // Двойной тап (открытие меню)
    if (pinched && !prevPinchState[i]) {
      if (checkDoubleTap(i, now)) {
        // Проверяем, не нажали ли мы на иконку VK в открытом меню
        if (menuVisible) {
          const tip = hand[8];
          const vkItem = menuItems.find(it => it.shape === 'vk');
          if (vkItem && dist3(tip, vkItem.pos) < 0.1) {
             vkApp.style.display = 'block';
             vkClose.style.display = 'block';
             menuVisible = false;
             ui.textContent = "VK Video";
          } else {
             menuVisible = false; // Просто закрыть меню
             ui.textContent = "Меню закрыто";
          }
        } else {
          // Открыть меню
          const palm = hand[9];
          buildMenu(palm);
          menuVisible = true;
          ui.textContent = "Выбери предмет щипком";
        }
      }
    }
    
    // Взятие предметов (одинарный щипок)
    if (pinched && !prevPinchState[i]) {
       if (!menuVisible) {
         const tip = hand[8];
         // Ищем ближайший предмет
         let closest = null, minDist = 0.15;
         objects.forEach(obj => {
           if(!obj.held) {
             const d = dist3(tip, obj.pos);
             if(d < minDist) { closest = obj; minDist = d; }
           }
         });
         
         if (closest) {
           closest.held = true;
           closest.heldByHand = i;
           closest.holdOffset = closest.pos.sub(tip);
           ui.textContent = "Держи...";
         }
       }
    }
    
    // Отпускание
    if (!pinched && prevPinchState[i]) {
      objects.forEach(obj => {
        if(obj.held && obj.heldByHand === i) obj.release();
      });
    }
    
    prevPinchState[i] = pinched;
    
    // Калибровка пола (если руки опущены вниз)
    if (hand[0].y < CAM_Y - 0.6) {
      floorY = Math.min(floorY, hand[0].y - 0.1);
    }
  });

  // 2. Физика
  objects.forEach(obj => obj.update(dt, now));
  objects = objects.filter(o => o.pos.y > -10); // Удаляем упавшие
  
  // 3. Отрисовка (Стерео)
  const halfW = W / 2;
  for (let eye = 0; eye < 2; eye++) {
    const eyeSign = eye === 0 ? -1 : 1;
    const offX = eye * halfW;
    
    ctx.save();
    ctx.beginPath(); ctx.rect(offX, 0, halfW, H); ctx.clip();
    
    drawFloor(eyeSign, halfW, offX);
    
    // Меню
    if (menuVisible) {
      menuItems.forEach(item => {
        // Рисуем как объект
        const fakeObj = { pos: item.pos, shape: item.shape, color: item.color, size: 0.06, held: false, rotation: 0 };
        drawObject(fakeObj, eyeSign, halfW, offX);
        
        // Подпись
        const p = project(item.pos, eyeSign, halfW, offX);
        if(p.visible) {
           ctx.fillStyle = '#fff'; ctx.font = '14px Arial'; ctx.textAlign = 'center';
           ctx.fillText(item.label, p.x, p.y + 30 * p.scale * halfW);
        }
      });
    }
    
    // Предметы
    objects.sort((a,b) => b.pos.z - a.pos.z).forEach(obj => drawObject(obj, eyeSign, halfW, offX));
    
    // Руки (поверх всего)
    drawHands(eyeSign, halfW, offX);
    
    ctx.restore();
  }
  
  requestAnimationFrame(loop);
}

// Кнопка закрытия ВК
vkClose.addEventListener('click', () => {
  vkApp.style.display = 'none';
  vkClose.style.display = 'none';
  vkFrame.src = ''; // Остановить видео
});

// Старт
startBtn.addEventListener('click', async () => {
  const ok = await requestCamera();
  if (!ok) return;
  startScreen.style.display = 'none';
  loading.style.display = 'flex';
  try {
    await initHandTracking();
    loading.style.display = 'none';
    loop();
  } catch (e) {
    alert('Ошибка запуска: ' + e);
  }
});
</script>
